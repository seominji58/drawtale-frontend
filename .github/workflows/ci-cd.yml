# 통합 브랜치(feat/backend-contract · dev)에 푸시하면 빌드해서 VM 에 올린다.
# PR 은 빌드(타입 검사 포함)만 한다. 받는 쪽은 drawtale-backend/deploy/remote-deploy.sh 다.
name: CI/CD

on:
  push:
    branches: [feat/backend-contract, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_ENGINE: agent
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      VITE_KAKAO_CLIENT_ID: ${{ vars.VITE_KAKAO_CLIENT_ID }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      # 보호자 본인인증 (포트원 상점 아이디 · KG이니시스 본인인증 채널 키, 공개 값, 2026-11-09).
      # 비어 있으면 가입 화면에 본인인증이 안 나오는데 운영 백엔드는 요구해서 가입이 막힌다
      VITE_PORTONE_STORE_ID: ${{ vars.VITE_PORTONE_STORE_ID }}
      VITE_PORTONE_IDV_CHANNEL_KEY: ${{ vars.VITE_PORTONE_IDV_CHANNEL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: 배포 키 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: VM 에 올리기
        run: |
          tar -czf - -C dist . \
            | ssh -i ~/.ssh/deploy_key azureuser@${{ vars.DEPLOY_HOST }} frontend
