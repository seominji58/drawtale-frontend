<!doctype html>
<html lang="ko" data-level="2">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F7F1E6" />
    <title>한칸이야기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 그림책 종이 방향 (2026-10-28): 제목 · 버튼은 손글씨(개구), 아이 화면 본문은 고운돋움 -->
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
    <!-- 어른 화면 본문용 한글 서체 (빽빽한 설명은 고딕이 읽기 쉽다) -->
    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <!-- 찢은 종이 가장자리 (카드 하나만 있는 화면: S-14 · S-15 · S-16). 그림 파일 없이 브라우저가 만든다.
         카드 글자는 흔들지 않고 카드 바탕(::before)에만 건다. 필터를 모르는 브라우저는 반듯한 카드로 보인다 -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="paper-torn" x="-4%" y="-4%" width="108%" height="108%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="4" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G" result="torn" />
        <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#3A2E26" flood-opacity="0.14" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
